<svg width="320" height="60" viewBox="0 0 320 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="gradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3dd1cc" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
    </defs>
    
    <!-- Shield Icon (Badge) -->
    <g transform="translate(5, 5) scale(0.1)">
        <circle cx="256" cy="256" r="250" fill="#08090C" />
        <path d="M256 70 L130 115 V255 C130 365 256 445 256 445 C256 445 382 365 382 255 V115 L256 70 Z" 
              fill="#0D2B23" fill-opacity="0.8" stroke="#10B981" stroke-width="15" />
        <path d="M190 350 V315 H225" stroke="#10B981" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" />
        <g transform="translate(250 240) rotate(-15) translate(-125 -40)">
            <rect width="170" height="80" rx="10" fill="url(#gradLogo)" />
            <circle cx="160" cy="40" r="24" fill="#08090C" />
            <circle cx="160" cy="40" r="10" fill="#FFFFFF" opacity="0.8" />
        </g>
    </g>
    
    <!-- Text Branding -->
    <text x="75" y="32" font-family="'Inter', 'Space Grotesk', sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" letter-spacing="-0.5">Next</text>
    <text x="145" y="32" font-family="'Inter', 'Space Grotesk', sans-serif" font-weight="900" font-size="30" fill="#3DD1CC" letter-spacing="-0.5">Level</text>
    <text x="75" y="52" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#10B981" letter-spacing="8">CCTV</text>
    
    <!-- Tagline (Argentine context) -->
    <text x="180" y="52" font-family="'Inter', sans-serif" font-weight="400" font-size="8" fill="#5c6380" letter-spacing="1">SEGURIDAD PROFESIONAL</text>
</svg>
